# This rule is not used by the project slo-custom-ressource itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the batch.slo.operator.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: slo-custom-ressource
    app.kubernetes.io/managed-by: kustomize
  name: slo-editor-role
rules:
- apiGroups:
  - batch.slo.operator.com
  resources:
  - slos
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch.slo.operator.com
  resources:
  - slos/status
  verbs:
  - get
