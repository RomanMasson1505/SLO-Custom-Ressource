# ⚠️ EXEMPLE D'INSPIRATION — recopie/adapte dans config/samples/batch_v1_slo.yaml.
# Montre comment un utilisateur déclare un SLO une fois ta CRD installée (`make install`).
apiVersion: batch.slo.operator.com/v1
kind: SLO
metadata:
  labels:
    app.kubernetes.io/name: slo-custom-ressource
    app.kubernetes.io/managed-by: kustomize
  name: api-availability-slo
spec:
  # Labels identifiant le service/les pods concernés (entrée "podLabel").
  podLabels:
    app: my-api

  # Où interroger Prometheus.
  prometheusAddress: "http://prometheus-operated.monitoring.svc:9090"

  # Métrique PromQL = ratio de succès (résultat entre 0 et 1).
  metric: |
    sum(rate(http_requests_total{app="my-api", status!~"5.."}[5m]))
    /
    sum(rate(http_requests_total{app="my-api"}[5m]))

  # Objectif : 99.9% de disponibilité.
  target: "99.9"

  # Fenêtre globale d'évaluation du SLO.
  window: "30d"

  # Sous-fenêtre récente utilisée pour la prédiction de tendance.
  predictionWindow: "1h"

  # Fréquence de ré-évaluation par le contrôleur.
  pollingInterval: "60s"
