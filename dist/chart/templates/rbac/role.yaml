{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: slo-custom-ressource-manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.coreos.com
  resources:
  - prometheusrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.slo.romanmasson.dev
  resources:
  - servicelevelobjectives
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.slo.romanmasson.dev
  resources:
  - servicelevelobjectives/finalizers
  verbs:
  - update
- apiGroups:
  - sre.slo.romanmasson.dev
  resources:
  - servicelevelobjectives/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
