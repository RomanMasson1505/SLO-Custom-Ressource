# Demo workload for the local e2e walkthrough.
#
# A tiny Python app that continuously increments a Prometheus counter
# http_requests_total{service="checkout",code="200"} (~10/s), plus
# http_requests_total{...,code="500"} at a rate you control at runtime:
#   curl "http://<pod>:8080/set-errors?n=5"   -> 5 errors/s
#   curl "http://<pod>:8080/set-errors?n=0"   -> back to healthy
#
# It is intentionally multi-arch (python:3-alpine) so it runs on Apple Silicon.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-app
  namespace: demo
data:
  app.py: |
    import http.server
    import threading
    import time
    from urllib.parse import urlparse, parse_qs

    counts = {"200": 0, "500": 0}
    errors_per_sec = 0

    def generate_traffic():
        # Simulate ~10 successful requests per second, plus a controllable
        # number of failing ones, so rate() has real data to work with.
        while True:
            counts["200"] += 10
            counts["500"] += errors_per_sec
            time.sleep(1)

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            global errors_per_sec
            if self.path == "/metrics":
                body = (
                    "# HELP http_requests_total Total HTTP requests.\n"
                    "# TYPE http_requests_total counter\n"
                )
                for code, n in counts.items():
                    body += 'http_requests_total{service="checkout",code="%s"} %d\n' % (code, n)
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(body.encode())
            elif self.path.startswith("/set-errors"):
                q = parse_qs(urlparse(self.path).query)
                errors_per_sec = int(q.get("n", ["0"])[0])
                self.send_response(200)
                self.end_headers()
                self.wfile.write(("errors_per_sec=%d\n" % errors_per_sec).encode())
            else:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")

        def log_message(self, *args):
            pass  # keep the logs quiet

    threading.Thread(target=generate_traffic, daemon=True).start()
    http.server.HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: app
          image: python:3-alpine
          command: ["python", "/app/app.py"]
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: code
          configMap:
            name: checkout-app
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: demo
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: checkout
  namespace: demo
  labels:
    app: checkout
spec:
  selector:
    matchLabels:
      app: checkout
  namespaceSelector:
    matchNames: ["demo"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
