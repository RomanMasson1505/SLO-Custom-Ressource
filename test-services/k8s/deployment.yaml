---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-api
  namespace: default
  labels:
    app: fake-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-api
  template:
    metadata:
      labels:
        app: fake-api
      annotations:
        # Annotation pour que Prometheus scrape ce pod directement (sans ServiceMonitor)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fake-api
        image: fake-api:latest
        imagePullPolicy: Never   # image buildée localement (ex: minikube)
        ports:
        - containerPort: 8080
        env:
        - name: ERROR_RATE
          value: "0.05"          # 5% d'erreurs → SLO ~95%
        - name: REQUESTS_PER_SECOND
          value: "10"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-api
  namespace: default
  labels:
    app: fake-api
spec:
  selector:
    app: fake-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
